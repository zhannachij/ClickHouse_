volumes:
  clickhouse_data:
  zookeeper_data:
  prometheus_data:
  grafana_data:


# common network for all services
networks:
  otus_ch_net:
    driver: bridge

# ch-common-configs anchor
x-configs: &ch-common-configs
  image: clickhouse/clickhouse-server
  environment:
    TZ: "Europe/Moscow"
  ulimits: # OS resource limits
    nproc: 65535  # max processors per user
    nofile:
      soft: 262144
      hard: 262144
  networks:
    - otus_ch_net
  depends_on:
    - zookeeper

services:
  # ================================================
  # ZooKeeper (one node)
  # ================================================
  zookeeper:
    image: zookeeper:latest
    container_name: zk
    hostname: zookeeper
    networks:
      - otus_ch_net
    environment:
      - ALLOW_ANONYMOUS_LOGIN=yes
      - ZOOKEEPER_CLIENT_PORT=2181
      - TZ="Europe/Moscow"
    ports:
      - "2182:2181"
      - "2888:2888"
      - "3888:3888"

  # ================================================
  # ClickHouse Cluster (four nodes)
  # ================================================
  clickhouse1:
    <<: *ch-common-configs
    container_name: ch1
    hostname: clickhouse1
    volumes:
      # common part:
      - ./config/default_user.xml:/etc/clickhouse-server/users.d/default_user.xml
      - ./config/zk.xml:/etc/clickhouse-server/config.d/zk.xml
      - ./config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml
      - ./config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
      # unique part
      - ./config/macros_ch1.xml:/etc/clickhouse-server/config.d/macros.xml
    ports:
      - "8002:9000"
      - "9123:8123"
      - "9364:9363"
    command: ["--config-file", "/etc/clickhouse-server/config.xml"]
  clickhouse2:
    <<: *ch-common-configs
    container_name: ch2
    hostname: clickhouse2
    volumes:
      # common part:
      - ./config/default_user.xml:/etc/clickhouse-server/users.d/default_user.xml
      - ./config/zk.xml:/etc/clickhouse-server/config.d/zk.xml
      - ./config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml
      - ./config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
      # unique part
      - ./config/macros_ch2.xml:/etc/clickhouse-server/config.d/macros.xml
    ports:
      - "8003:9000"
      - "9124:8123"
      - "9365:9363"
    command: ["--config-file", "/etc/clickhouse-server/config.xml"]
  clickhouse3:
    <<: *ch-common-configs
    container_name: ch3
    hostname: clickhouse3
    volumes:
      # common part:
      - ./config/default_user.xml:/etc/clickhouse-server/users.d/default_user.xml
      - ./config/zk.xml:/etc/clickhouse-server/config.d/zk.xml
      - ./config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml
      - ./config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
      # unique part
      - ./config/macros_ch3.xml:/etc/clickhouse-server/config.d/macros.xml
    ports:
      - "8004:9000"
      - "9125:8123"
      - "9366:9363"
    command: ["--config-file", "/etc/clickhouse-server/config.xml"]
  clickhouse4:
    <<: *ch-common-configs
    container_name: ch4
    hostname: clickhouse4
    volumes:
      # common part:
      - ./config/default_user.xml:/etc/clickhouse-server/users.d/default_user.xml
      - ./config/zk.xml:/etc/clickhouse-server/config.d/zk.xml
      - ./config/remote-servers.xml:/etc/clickhouse-server/config.d/remote-servers.xml
      - ./config/prometheus.xml:/etc/clickhouse-server/config.d/prometheus.xml
      # unique part
      - ./config/macros_ch4.xml:/etc/clickhouse-server/config.d/macros.xml
    ports:
      - "8005:9000"
      - "9126:8123"
      - "9367:9363"
    command: ["--config-file", "/etc/clickhouse-server/config.xml"]

  # ================================================
  # Prometheus
  # ================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: prom
    hostname: prometheus
    restart: unless-stopped
    ports:
      - 9090:9090
    volumes:
      - ./config/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
    networks:
      - otus_ch_net
    environment:
      - TZ= "Europe/Moscow"
    command:
      - --config.file=/etc/prometheus/prometheus.yml

  # ================================================
  # Grafana
  # ================================================
  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana
    hostname: grafana
    restart: unless-stopped
    ports:
      - 3000:3000
    volumes:
      - ./config/grafana/provisioning:/etc/grafana/provisioning
      - ./config/grafana/dashboards:/etc/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=****
      - TZ="Europe/Moscow"
    networks:
      - otus_ch_net
    depends_on:
      - prometheus



  # ================================================
  # Kafka
  # ================================================
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
      - "9999:9999"
    environment:
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://${DOCKER_HOST_IP:-127.0.0.1}:9092,DOCKER://host.docker.internal:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,DOCKER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_ZOOKEEPER_CONNECT: "zookeeper:2181"
      KAFKA_BROKER_ID: 1
      KAFKA_LOG4J_LOGGERS: "kafka.controller=INFO,kafka.producer.async.DefaultEventHandler=INFO,state.change.logger=INFO"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_JMX_PORT: 9999
      KAFKA_JMX_HOSTNAME: ${DOCKER_HOST_IP:-127.0.0.1}
      KAFKA_AUTHORIZER_CLASS_NAME: kafka.security.authorizer.AclAuthorizer
      KAFKA_ALLOW_EVERYONE_IF_NO_ACL_FOUND: "true"
    networks:
      - otus_ch_net
    depends_on:
      - zookeeper